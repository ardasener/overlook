name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest # shell-dependent Rust PTY tests require a real shell
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.2.17 # matches package.json's packageManager

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: install frontend dependencies
        run: bun install

      - name: rust checks (cargo test + clippy)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: frontend checks (vitest + types + lint)
        run: |
          bun run test
          bun run check-types
          bun run lint
