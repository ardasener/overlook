name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.2.17 # matches package.json's packageManager

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: install frontend dependencies
        run: bun install

      # Ubuntu runners lack the GTK/WebKitGTK dev libraries Tauri links
      # against, and lack zsh which the PTY integration tests require
      # (print builtin, RPROMPT redraws, /bin/zsh fallback); mirror the
      # package set release.yml installs plus zsh.
      - name: install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev zsh

      - name: rust checks (cargo test + clippy)
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: frontend checks (vitest + types + lint)
        run: |
          bun run test
          bun run check-types
          bun run lint
